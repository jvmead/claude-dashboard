[project]
name = "claude-dashboard"
version = "0.1.0"
description = "Glanceable local dashboard for live Claude Code sessions and their subagents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "E", "W", "B", "UP"]
